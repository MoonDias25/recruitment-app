<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .error-card {
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            border: 1px solid #fee2e2;
        }
        .error-icon {
            font-size: 3rem;
            color: #dc2626;
        }
    </style>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4 error-card bg-white text-center">

        <div class="mb-3">
            <i class="bi bi-exclamation-triangle-fill error-icon"></i>
        </div>

        <h4 class="fw-semibold text-danger mb-2">Authorization Error</h4>
        <p class="text-muted small mb-4">Something went wrong during the authentication process.</p>

        <div class="alert alert-danger text-start small mb-4" role="alert">
            <div class="mb-1">
                <strong>Error Code:</strong>
                <code class="text-dark" th:text="${oauth2_error_code ?: 'unknown_error'}">invalid_request</code>
            </div>
            <div>
                <strong>Description:</strong>
                <span th:text="${oauth2_error_description ?: 'No description provided.'}">An unexpected error occurred.</span>
            </div>
        </div>

        <div class="d-grid">
            <a href="/" class="btn btn-outline-secondary py-2 small fw-medium">
                Back to Home
            </a>
        </div>

    </div>
</div>
</body>
</html>
